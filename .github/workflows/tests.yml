# The checks, on every push and pull request: the computer side
# (tests/test_sign_in.py, against a stand-in Supabase), the phones' own code
# (tests/phone, the real mobile/web scripts in Node) and the What's new
# summary function. Nothing reaches the real Supabase.
name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Computer side
        run: python tests/test_sign_in.py

      - name: Phones
        env:
          PYTHON: python
        run: node --test tests/phone/

      - name: What's new summaries
        run: node --test supabase/functions/whats-new/
